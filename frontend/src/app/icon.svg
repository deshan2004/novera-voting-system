<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5D6"/>
      <stop offset="25%" stop-color="#ECD599"/>
      <stop offset="65%" stop-color="#B3924F"/>
      <stop offset="100%" stop-color="#84652A"/>
    </linearGradient>
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ECD599" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="darkBg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1F1A13"/>
      <stop offset="60%" stop-color="#0E0C09"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#ECD599" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Luxury Obsidian Rounded Squircle Badge -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#darkBg)" stroke="url(#goldGrad)" stroke-width="12"/>

  <!-- Inner Delicate Gold Orbit Frame -->
  <rect x="36" y="36" width="440" height="440" rx="100" fill="none" stroke="rgba(236,213,153,0.3)" stroke-width="2.5" stroke-dasharray="8 6"/>

  <!-- Haute Couture Runway Crown -->
  <g filter="url(#goldGlow)">
    <!-- Crown Body Spikes -->
    <path d="M110 326 L90 186 L180 246 L256 130 L332 246 L422 186 L402 326 Z" fill="url(#goldGrad)"/>
    
    <!-- Crown Base Band -->
    <rect x="106" y="340" width="300" height="42" rx="8" fill="url(#goldGrad)"/>

    <!-- Peak Jewels -->
    <circle cx="90" cy="176" r="15" fill="url(#goldGrad)"/>
    <circle cx="180" cy="238" r="12" fill="url(#goldGrad)"/>
    <circle cx="256" cy="118" r="20" fill="url(#goldGrad)"/>
    <circle cx="332" cy="238" r="12" fill="url(#goldGrad)"/>
    <circle cx="422" cy="176" r="15" fill="url(#goldGrad)"/>

    <!-- Jewel Cutouts on Base Band -->
    <circle cx="170" cy="361" r="7" fill="#0E0C09"/>
    <circle cx="256" cy="361" r="9" fill="#0E0C09"/>
    <circle cx="342" cy="361" r="7" fill="#0E0C09"/>

    <!-- Elegant '26 Monogram Badge -->
    <g transform="translate(256, 420)">
      <text x="0" y="0" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', serif, sans-serif" font-size="28" font-weight="900" letter-spacing="4" fill="url(#goldGrad)">NOVERA &apos;26</text>
    </g>
  </g>
</svg>

